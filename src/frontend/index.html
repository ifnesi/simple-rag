<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAQ Assistant</title>
  <style>
    :root {
      --bg: #f4f5f8; --panel: #ffffff; --text: #1b1f27; --muted: #6a7282; --border: #e3e6ec;
      --accent: #4f46e5; --accent-soft: #eef0ff; --user-bg: #4f46e5; --user-text: #ffffff;
      --chip-bg: #f0f2f6; --ok: #16a34a; --bad: #dc2626; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1218; --panel: #171b24; --text: #e8ebf2; --muted: #98a2b3; --border: #272d3a;
        --accent: #818cf8; --accent-soft: #1e2250; --user-bg: #4f46e5; --user-text: #ffffff;
        --chip-bg: #212736; --ok: #4ade80; --bad: #f87171; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .app { width: 100%; height: 100vh; padding: 20px 28px; display: flex; flex-direction: column; gap: 14px; }

    header { display: flex; align-items: center; gap: 12px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: grid; place-items: center; color: #fff; font-size: 20px; flex: none; }
    header h1 { font-size: 1.1rem; margin: 0; line-height: 1.2; }
    header p { margin: 0; color: var(--muted); font-size: .85rem; }
    .spacer { flex: 1; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--border);
             border-radius: 999px; font-size: .78rem; color: var(--muted); background: var(--panel); white-space: nowrap; }
    a.badge { text-decoration: none; cursor: pointer; }
    a.badge:hover { color: var(--text); border-color: var(--accent); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    .ghost { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 999px;
             padding: 4px 12px; font-size: .78rem; cursor: pointer; }
    .ghost:hover { color: var(--text); }
    a.ghost { text-decoration: none; }
    button.badge { font: inherit; font-size: .78rem; cursor: pointer; }
    button.badge:hover { color: var(--text); border-color: var(--accent); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(8, 10, 16, .6); display: flex;
                      align-items: center; justify-content: center; padding: 24px; z-index: 50; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; width: min(1200px, 100%);
             max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
             box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
    .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .modal-body { padding: 12px; overflow: auto; background: #fff; } /* white: the diagram is drawn on white */
    .modal-body img { display: block; width: 100%; height: auto; }
    .modal-body p { margin: 0; padding: 24px; color: #555; text-align: center; }

    .thread { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
              box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    .empty { margin: auto; text-align: center; max-width: 460px; }
    .empty .big { font-size: 2rem; }
    .empty h2 { margin: 6px 0 4px; font-size: 1.15rem; }
    .empty p { margin: 0 0 16px; color: var(--muted); }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .suggestion { border: 1px solid var(--border); background: var(--chip-bg); color: var(--text); padding: 8px 14px;
                  border-radius: 999px; font-size: .88rem; cursor: pointer; }
    .suggestion:hover { border-color: var(--accent); color: var(--accent); }

    .row { display: flex; gap: 10px; max-width: 100%; }
    .row.user { justify-content: flex-end; }
    .avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
              display: grid; place-items: center; font-size: 14px; flex: none; margin-top: 2px; }
    .bubble { padding: 10px 14px; border-radius: 14px; max-width: 85%; overflow-wrap: anywhere; }
    .user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant .bubble { background: var(--chip-bg); border-top-left-radius: 4px; }
    .assistant .bubble.error { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
    .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 8px; }
    .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.3; }
    .md h1 { font-size: 1.2rem; } .md h2 { font-size: 1.1rem; } .md h3, .md h4 { font-size: 1rem; }
    .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
    .md li { margin: 3px 0; } .md li > p { margin: 0; }
    .md code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
               font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; }
    .md pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
    .md pre code { border: 0; padding: 0; background: none; }
    .md a { color: var(--accent); }
    .md blockquote { margin: 0 0 8px; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .md table { border-collapse: collapse; margin-bottom: 8px; }
    .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; }
    .sources { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); }
    .src { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px;
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }

    .opts { display: flex; gap: 8px; flex-wrap: wrap; }
    .steps { margin-top: 10px; font-size: .8rem; color: var(--muted); }
    .steps summary { cursor: pointer; user-select: none; }
    .steps ol { margin: 6px 0 0; padding-left: 20px; }
    .status { margin-left: 8px; font-size: .85rem; color: var(--muted); vertical-align: middle; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

    form { display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--border);
           border-radius: 16px; padding: 8px; box-shadow: var(--shadow); }
    form:focus-within { border-color: var(--accent); }
    input[type=text] { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; padding: 8px 10px; }
    select { border: 1px solid var(--border); background: var(--chip-bg); color: var(--muted); border-radius: 10px; padding: 8px 8px; font: inherit; font-size: .85rem; }
    .send { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .send:disabled { opacity: .45; cursor: default; }
    footer { text-align: center; color: var(--muted); font-size: .76rem; }
    @media (max-width: 520px) { .app { padding: 14px 12px; } select { display: none; } .bubble { max-width: 92%; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.3/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUGGESTIONS = [
      "How do I reset my password?",
      "How do I enable SSO?",
      "What is the unlimited PTO policy?",
      "How does equity vesting work?",
    ];

    // The model answers in Markdown: convert to HTML, then sanitize it before inserting into the page.
    function Markdown({ text }) {
      const html = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
      return <div className="md" dangerouslySetInnerHTML={{ __html: html }} />;
    }

    function Message({ m }) {
      if (m.role === "user") {
        return <div className="row user"><div className="bubble">{m.text}</div></div>;
      }
      return (
        <div className="row assistant">
          <div className="avatar">✦</div>
          <div className={"bubble" + (m.error ? " error" : "")}>
            {m.error ? m.text : <Markdown text={m.text} />}
            {m.steps && m.steps.length > 0 && (
              <details className="steps">
                <summary>Steps ({m.steps.length})</summary>
                <ol>{m.steps.map((t, i) => <li key={i}>{t}</li>)}</ol>
              </details>
            )}
            {m.sources && m.sources.length > 0 && (
              <div className="sources">
                Sources {m.sources.map(s => <span className="src" key={s}>{s}</span>)}
              </div>
            )}
          </div>
        </div>
      );
    }

    // One id per chat; the backend uses it to remember the last few turns. randomUUID needs a secure
    // context (https or localhost), so fall back to Math.random elsewhere.
    function newSessionId() {
      return (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : "s" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function App() {
      const sessionId = useRef(newSessionId());
      const [messages, setMessages] = useState([]);
      const [question, setQuestion] = useState("");
      const [topK, setTopK] = useState(4);
      // Ollama models the user can pick. "" means the server default (OLLAMA_MODEL in .env).
      const [models, setModels] = useState({ default: "", models: [], details: {} });
      const [model, setModel] = useState(() => { try { return localStorage.getItem("model") || ""; } catch { return ""; } });
      const [loading, setLoading] = useState(false);
      const [steps, setSteps] = useState([]);  // what the backend reports while a question is running
      const [mcp, setMcp] = useState("checking");
      const endRef = useRef(null);
      const [showDiagram, setShowDiagram] = useState(false);
      const [diagramFailed, setDiagramFailed] = useState(false);

      // Esc closes the architecture diagram popup
      useEffect(() => {
        if (!showDiagram) return;
        const onKey = e => { if (e.key === "Escape") setShowDiagram(false); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [showDiagram]);

      useEffect(() => {
        const check = () =>
          fetch("/api/health").then(r => setMcp(r.ok ? "ok" : "down")).catch(() => setMcp("down"));
        check();
        const id = setInterval(check, 15000);
        return () => clearInterval(id);
      }, []);

      // Thinking effort and context window ("" = the model's / server's default), remembered in the browser
      const saved = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
      const [effort, setEffort] = useState(() => saved("effort"));
      const [numCtx, setNumCtx] = useState(() => saved("num_ctx"));
      const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

      // What the selected model supports, as reported by Ollama through the MCP server
      const info = (models.details || {})[model || models.default] || {};
      const effortOptions = info.thinking === "levels" ? [["low", "Low"], ["medium", "Medium"], ["high", "High"]]
                          : info.thinking === "toggle" ? [["on", "On"], ["off", "Off"]] : [];
      const ctxOptions = (() => {
        const max = info.max_context;
        if (!max) return [];
        const sizes = [2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144].filter(n => n < max);
        return [...sizes, max];
      })();
      // Drop a saved choice the selected model cannot honour
      const effortValue = effortOptions.some(([v]) => v === effort) ? effort : "";
      const ctxValue = ctxOptions.includes(Number(numCtx)) ? numCtx : "";

      // Load the model list once the MCP server is reachable; forget a saved model that is gone
      useEffect(() => {
        if (mcp !== "ok" || models.models.length) return;
        fetch("/api/models").then(r => r.ok ? r.json() : null).then(d => {
          if (!d || !d.models) return;
          setModels(d);
          setModel(m => (m && d.models.includes(m) ? m : ""));
        }).catch(() => {});
      }, [mcp]);

      function pickModel(m) {
        setModel(m);
        try { localStorage.setItem("model", m); } catch {}
      }

      useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); },
                [messages, loading]);

      async function send(text) {
        const q = text.trim();
        if (!q || loading) return;
        setMessages(m => [...m, { role: "user", text: q }]);
        setQuestion(""); setLoading(true); setSteps([]);
        const seen = [];
        try {
          const r = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q, top_k: topK, session_id: sessionId.current, stream: true, ...(model ? { model } : {}),
              ...(effortValue ? { effort: effortValue } : {}), ...(ctxValue ? { num_ctx: Number(ctxValue) } : {}) }),
          });
          if (!r.ok) {
            const data = await r.json().catch(() => ({}));
            throw new Error(data.error || "Request failed");
          }
          // One JSON object per line: status updates, then the result (or an error)
          const reader = r.body.getReader();
          const decoder = new TextDecoder();
          let buf = "", result = null;
          const handle = line => {
            if (!line.trim()) return;
            const ev = JSON.parse(line);
            if (ev.type === "status") { seen.push(ev.text); setSteps([...seen]); }
            else if (ev.type === "error") throw new Error(ev.error);
            else if (ev.type === "result") result = ev;
          };
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop();
            lines.forEach(handle);
          }
          handle(buf);
          if (!result) throw new Error("No answer received");
          setMessages(m => [...m, { role: "assistant", text: result.answer, sources: result.sources, steps: seen }]);
        } catch (err) {
          setMessages(m => [...m, { role: "assistant", text: err.message, error: true }]);
        } finally {
          setLoading(false); setSteps([]);
        }
      }

      // The MCP Inspector runs next to this page, on port 6274 of the same host
      const inspectorUrl = `${window.location.protocol}//${window.location.hostname}:6274/`;
      const diagramUrl = "/docs/system_architecture_diagram.png"; // served by Flask from the docs/ folder
      const badge = { ok: ["ok", "MCP connected"], down: ["bad", "MCP unreachable"], checking: ["", "Checking…"] }[mcp];

      return (
        <div className="app">
          <header>
            <div className="logo">✦</div>
            <div>
              <h1>FAQ Assistant</h1>
              <p>Answers grounded in our FAQ documents</p>
            </div>
            <div className="spacer" />
            {messages.length > 0 && <button className="ghost" onClick={() => { setMessages([]); sessionId.current = newSessionId(); }}>Clear</button>}
            {mcp === "ok" ? (
              <a className="badge" href={inspectorUrl} target="_blank" rel="noopener noreferrer"
                 title="Open the MCP Inspector in a new tab">
                <span className="dot ok" />{badge[1]} ↗
              </a>
            ) : (
              <span className="badge"><span className={"dot " + badge[0]} />{badge[1]}</span>
            )}
            <button className="badge" title="Show the system architecture diagram"
                    onClick={() => { setDiagramFailed(false); setShowDiagram(true); }}>
              Architecture diagram
            </button>
          </header>

          <div className="thread">
            {messages.length === 0 && (
              <div className="empty">
                <div className="big">💬</div>
                <h2>What would you like to know?</h2>
                <p>Ask a question, or try one of these.</p>
                <div className="suggestions">
                  {SUGGESTIONS.map(s => (
                    <button key={s} className="suggestion" onClick={() => send(s)}>{s}</button>
                  ))}
                </div>
              </div>
            )}
            {messages.map((m, i) => <Message key={i} m={m} />)}
            {loading && (
              <div className="row assistant">
                <div className="avatar">✦</div>
                <div className="bubble">
                  <span className="typing"><i /><i /><i /></span>
                  {steps.length > 0 && <span className="status">{steps[steps.length - 1]}…</span>}
                </div>
              </div>
            )}
            <div ref={endRef} />
          </div>

          <div className="opts">
            {models.models.length > 0 && (
              <select value={model || models.default} onChange={e => pickModel(e.target.value === models.default ? "" : e.target.value)}
                      title="Ollama model used to answer (the default comes from OLLAMA_MODEL)">
                {[...new Set([models.default, ...models.models])].filter(Boolean).map(n => (
                  <option key={n} value={n}>{n}{n === models.default ? " (default)" : ""}</option>
                ))}
              </select>
            )}
            {effortOptions.length > 0 && (
              <select value={effortValue} onChange={e => { setEffort(e.target.value); remember("effort", e.target.value); }}
                      title="Thinking effort (only for models that can think)">
                <option value="">Thinking: default</option>
                {effortOptions.map(([v, l]) => <option key={v} value={v}>Thinking: {l}</option>)}
              </select>
            )}
            {ctxOptions.length > 0 && (
              <select value={ctxValue} onChange={e => { setNumCtx(e.target.value); remember("num_ctx", e.target.value); }}
                      title="Context window in tokens (up to the model's maximum). Larger needs more memory and is slower.">
                <option value="">Context: default</option>
                {ctxOptions.map(n => <option key={n} value={n}>Context: {n.toLocaleString("en-US")}</option>)}
              </select>
            )}
          </div>

          <form onSubmit={e => { e.preventDefault(); send(question); }}>
            <input type="text" value={question} onChange={e => setQuestion(e.target.value)}
                   placeholder="Ask about authentication, SSO, HR policies…" autoFocus />
            <select value={topK} onChange={e => setTopK(Number(e.target.value))} title="Number of chunks to retrieve (top_k)">
              {[...Array(10)].map((_, i) => <option key={i + 1} value={i + 1}>top {i + 1}</option>)}
            </select>
            <button className="send" disabled={loading || !question.trim()}>Ask</button>
          </form>

          {showDiagram && (
            <div className="modal-backdrop" onClick={() => setShowDiagram(false)}>
              <div className="modal" role="dialog" aria-modal="true" aria-label="System architecture diagram"
                   onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                  <strong>System architecture</strong>
                  <div className="spacer" />
                  <a className="ghost" href={diagramUrl} target="_blank" rel="noopener noreferrer">Open full size ↗</a>
                  <button className="ghost" aria-label="Close" onClick={() => setShowDiagram(false)}>✕</button>
                </div>
                <div className="modal-body">
                  {diagramFailed
                    ? <p>The diagram could not be loaded.</p>
                    : <img src={diagramUrl} alt="System architecture: web, MCP server, vector DB, Ollama and Inspector"
                           onError={() => setDiagramFailed(true)} />}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
